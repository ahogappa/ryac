name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite plus steep finishes in ~10 minutes; without this, a hung
    # steep server once burned the full 6-hour default before cancellation.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range the gemspec claims to support. Without the
        # lower entry, required_ruby_version is an untested assertion.
        ruby-version: ["3.3", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: bundle install --jobs 4
      - name: Run tests
        run: bundle exec rake test:all
      # Steep runs once: it checks sig/ against lib/, which does not vary by
      # the Ruby the suite happens to run on.
      - name: Type check with Steep
        if: matrix.ruby-version == '4.0'
        run: bundle exec rbs collection install && bundle exec steep check

  # Optcarrot is the aggressive end of the supported range, so this one blocks.
  # It renders 180 frames from a real ROM and compares the checksum against the
  # unminified program, which no unit test can stand in for.
  optcarrot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Clone optcarrot
        run: |
          mkdir -p gem_tests
          git clone --depth 1 https://github.com/mame/optcarrot gem_tests/optcarrot
      - name: Verify rendered frames survive minification
        run: bundle exec rake test:optcarrot

  # sinatra and rubocop sit outside the supported range — they are canaries for
  # regressions, not a definition of what the minifier promises, so they do not
  # block the build.
  external-gems:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Clone gem sources
        run: |
          mkdir -p gem_tests
          cd gem_tests
          git clone --depth 1 https://github.com/sinatra/sinatra
          git clone --depth 1 https://github.com/rubocop/rubocop
      - name: Install sinatra test dependencies
        working-directory: gem_tests/sinatra
        run: bundle install --jobs 4
      - name: Install rubocop test dependencies
        working-directory: gem_tests/rubocop
        run: bundle install --jobs 4
      - name: Run gem integration tests
        run: bundle exec rake test:gems
